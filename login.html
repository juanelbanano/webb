<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - TechLog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #1a56db 0%, #0ea5e9 100%); min-height: 100vh;">
    <div class="container py-5">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <a href="index.html" class="text-white text-decoration-none">
                        <i class="bi bi-box-seam display-4 mb-2"></i>
                        <h2 class="fw-bold">TechLog</h2>
                    </a>
                </div>
                <div class="card border-0 shadow-lg">
                    <div class="card-body p-4 p-lg-5">
                        <div class="text-center mb-4">
                            <div class="bg-primary bg-opacity-10 rounded-circle p-3 d-inline-block mb-3">
                                <i class="bi bi-person-circle display-5 text-primary"></i>
                            </div>
                            <h4 class="fw-bold">Bienvenido de vuelta</h4>
                            <p class="text-muted">Ingresa tus credenciales para continuar</p>
                        </div>
                        
                        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electronico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-envelope text-muted"></i>
                                    </span>
                                    <input type="email" class="form-control border-start-0" id="email" placeholder="tu@email.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Contrasena</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-lock text-muted"></i>
                                    </span>
                                    <input type="password" class="form-control border-start-0" id="password" placeholder="Tu contrasena" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesion
                            </button>
                        </form>
                        
                        <div class="text-center">
                            <p class="mb-0">No tienes cuenta? <a href="register.html" class="text-primary fw-semibold">Registrate</a></p>
                        </div>
                        
                        <hr class="my-4">
                        
                        <div class="bg-light rounded-3 p-3">
                            <h6 class="fw-semibold mb-2 text-center">Credenciales de prueba</h6>
                            <div class="row g-2 small">
                                <div class="col-6">
                                    <div class="text-muted">Admin:</div>
                                    <code>admin@techlog.com</code><br>
                                    <code>admin123</code>
                                </div>
                                <div class="col-6">
                                    <div class="text-muted">Usuario:</div>
                                    <code>user@demo.com</code><br>
                                    <code>demo123</code>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
